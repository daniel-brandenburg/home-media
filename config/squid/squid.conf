# Egress proxy for agent devcontainers.
# Default-deny outbound; only the domains listed below are reachable.
# Sandbox containers are peers on the devcontainer-egress bridge network
# (see config/squid/squid.container and devcontainer-egress.network) and
# connect to squid:3128 via HTTP_PROXY/HTTPS_PROXY.

# Minimal ACLs
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

# Allowed destination domains.
# Common: Claude Code, Kimi Code, GitHub.
acl allowed_domains dstdomain \
    .api.anthropic.com \
    .claude.ai \
    .statsig.anthropic.com \
    .code.kimi.com \
    .api.moonshot.ai \
    .api.moonshot.cn \
    .registry.npmjs.org \
    .github.com \
    .github.io \
    .githubassets.com \
    .githubusercontent.com \
    .ghcr.io

# anothertradingplatform (.NET) extras
acl allowed_domains dstdomain \
    .nuget.org \
    .dotnetcli.blob.core.windows.net

# alarmclock (Flutter/Dart + Python + PlatformIO) extras
acl allowed_domains dstdomain \
    .pub.dev \
    .storage.googleapis.com \
    .pypi.org \
    .pythonhosted.org \
    .registry.platformio.org

# Sandbox containers are peers on the devcontainer-egress bridge network, not
# processes sharing this container's netns, so "who may connect" has to be an
# explicit source ACL now (matching devcontainer-egress.network's fixed
# subnet) rather than relying on a loopback-only http_port.
acl devcontainer_net src 10.89.1.0/24
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow devcontainer_net allowed_domains
http_access deny all

# Bind on the container's own interface on devcontainer-egress — not
# published to the host, so only peers on that private bridge network (i.e.
# sandbox containers, per the source ACL above) can reach it.
http_port 3128

# Logging — disabled because the container's 'proxy' user cannot write to
# stdout or /var/log/squid. Re-enable later with a writable log path if needed.
access_log none
cache_log /dev/null

# PID file: /run is root-owned in the container; use /tmp instead.
pid_filename /tmp/squid.pid

# DNS: use the resolver Podman provides for this network.
