pageInfo:
  title: Home Media Server
  description: Media, automation, and search control plane.

appConfig:
  theme: dark
  layout: grid
  iconSize: large
  statusCheck: true
  statusCheckInterval: 60
  defaultOpeningMethod: newtab
  hideComponents:
    hideSettings: false
    hideFooter: true

sections:
  - name: Media
    icon: si-jellyfin
    displayData:
      cols: 2
    items:
      - title: Jellyfin
        description: Stream your media library
        url: http://${REMOTE}:8096
        icon: si-jellyfin
        statusCheck: true
        statusCheckUrl: http://${REMOTE}:8096

      - title: Audiobookshelf
        description: Audiobook library and player
        url: http://${REMOTE}:13378
        icon: si-audiobookshelf
        statusCheck: true
        statusCheckUrl: http://${REMOTE}:13378

      - title: Calibre-Web-Automated
        description: Ebook library and reader
        url: http://${REMOTE}:8083
        icon: si-calibreweb
        statusCheck: true
        statusCheckUrl: http://${REMOTE}:8083

  - name: Automation
    icon: si-sonarr
    displayData:
      cols: 3
    items:
      - title: Sonarr
        description: TV series management
        url: http://${REMOTE}:8989
        icon: si-sonarr
        statusCheck: true
        statusCheckUrl: http://${REMOTE}:8989

      - title: Radarr
        description: Movie management
        url: http://${REMOTE}:7878
        icon: si-radarr
        statusCheck: true
        statusCheckUrl: http://${REMOTE}:7878

  - name: Network
    icon: si-qbittorrent
    displayData:
      cols: 2
    items:
      - title: qBittorrent
        description: Torrent download client
        url: http://${REMOTE}:8080
        icon: si-qbittorrent
        statusCheck: true
        statusCheckUrl: http://${REMOTE}:8080

      - title: Prowlarr
        description: Indexer management
        url: http://${REMOTE}:9696
        icon: si-prowlarr
        statusCheck: true
        statusCheckUrl: http://${REMOTE}:9696

      - title: Shelfmark
        description: Ebook search and downloader
        url: http://${REMOTE}:8084
        icon: si-bookstack
        statusCheck: true
        statusCheckUrl: http://${REMOTE}:8084

