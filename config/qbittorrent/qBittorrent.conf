[Application]
FileLogger\Age=1
FileLogger\AgeType=1
FileLogger\Backup=true
FileLogger\DeleteOld=true
FileLogger\Enabled=true
FileLogger\MaxSizeBytes=66560
FileLogger\Path=/config/qBittorrent/logs

[AutoRun]
enabled=false
program=

[BitTorrent]
Session\AddTorrentStopped=false
Session\AlternativeGlobalDLSpeedLimit=250
Session\AlternativeGlobalUPSpeedLimit=100
Session\BandwidthSchedulerEnabled=true
Session\DHTEnabled=true
Session\DefaultSavePath=/downloads/
Session\ExcludedFileNames=
Session\GlobalMaxInactiveSeedingMinutes=60
Session\GlobalMaxRatio=3
Session\GlobalMaxSeedingMinutes=1440
Session\IgnoreSlowTorrentsForQueueing=false
Session\MaxActiveDownloads=5
Session\MaxActiveTorrents=10
Session\Port=6881
Session\QueueingSystemEnabled=true
Session\SSL\Port=65015
Session\ShareLimitAction=Stop
Session\TempPath=/downloads/incomplete/
Session\TempPathEnabled=true
Session\UseAlternativeGlobalSpeedLimit=true

[Core]
AutoDeleteAddedTorrentFile=Never

[LegalNotice]
Accepted=true

[Meta]
MigrationVersion=8

[Network]
PortForwardingEnabled=false
Proxy\HostnameLookupEnabled=false
Proxy\Profiles\BitTorrent=false
Proxy\Profiles\Misc=false
Proxy\Profiles\RSS=false

[Preferences]
Connection\PortRangeMin=6881
Connection\UPnP=false
Downloads\SavePath=/downloads/
Downloads\TempPath=/downloads/incomplete/
General\Locale=en
HostHeaderValidation=false
MailNotification\req_auth=true
Scheduler\days=Weekday
Scheduler\end_time=@Variant(\0\0\0\xf\x3\xdc\xc5\0)
Scheduler\start_time=@Variant(\0\0\0\xf\x1\xee\x62\x80)
WebUI\Address=*
WebUI\AuthSubnetWhitelist=@Invalid()
; Username and Password_PBKDF2 are injected by deploy/tasks/config.py at deploy time.
; Do not set them here — they will be overwritten.
WebUI\CSRFProtection=false
WebUI\HostHeaderValidation=false
WebUI\LocalHostAuth=true
WebUI\SecureCookie=false
WebUI\ServerDomains=*
WebUICSRFProtection=false
WebUIHostHeaderValidation=false
WebUILocalHostAuthentication=false

[RSS]
AutoDownloader\DownloadRepacks=true
AutoDownloader\SmartEpisodeFilter=s(\\d+)e(\\d+), (\\d+)x(\\d+), "(\\d{4}[.\\-]\\d{1,2}[.\\-]\\d{1,2})", "(\\d{1,2}[.\\-]\\d{1,2}[.\\-]\\d{4})"
